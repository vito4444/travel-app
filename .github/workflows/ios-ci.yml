name: iOS Build & Simulator Screenshots

on:
  push:
    branches: [cursor/ios-trip-planner-0644]
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: 编译（iOS 模拟器）
        run: |
          set -eo pipefail
          xcodebuild \
            -project TripKeeper.xcodeproj \
            -target TripKeeper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -60

      - name: 构建真机未签名 ipa（供侧载）
        run: |
          set -eo pipefail
          xcodebuild \
            -project TripKeeper.xcodeproj \
            -target TripKeeper \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -30
          mkdir -p ipa/Payload
          cp -R build-ios/Release-iphoneos/TripKeeper.app ipa/Payload/
          cd ipa && zip -qry TripKeeper-unsigned.ipa Payload

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: TripKeeper-unsigned-ipa
          path: ipa/TripKeeper-unsigned.ipa
          if-no-files-found: error

      - name: 启动模拟器并截图
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = [
              dev for runtime, devs in data.items() if 'iOS' in runtime
              for dev in devs if dev['name'].startswith('iPhone')
          ]
          print(candidates[0]['udid'])
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/TripKeeper.app
          mkdir -p shots

          xcrun simctl launch "$UDID" com.tripkeeper.app -demoData
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/01-trip-list.png
          xcrun simctl terminate "$UDID" com.tripkeeper.app || true

          xcrun simctl launch "$UDID" com.tripkeeper.app -demoData -openFirstTrip
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/02-trip-detail.png
          xcrun simctl terminate "$UDID" com.tripkeeper.app || true

          xcrun simctl launch "$UDID" com.tripkeeper.app -demoData -openFirstTrip -openMap -mapDay 1
          sleep 40
          xcrun simctl io "$UDID" screenshot shots/03-route-map.png

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
          if-no-files-found: error
